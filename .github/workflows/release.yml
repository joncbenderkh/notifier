name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  notify:
    name: Build notify CLI binaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notify
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: notify/go.mod
          cache-dependency-path: notify/go.sum

      - name: Build binaries
        run: |
          version="${GITHUB_REF_NAME#v}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$version" \
              -o "dist/notify-$os-$arch$ext" .
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: notify/dist/*
          generate_release_notes: true

  android-unsigned:
    name: Build unsigned Android release artifacts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release APK and AAB (unsigned)
        env:
          NOTIFIER_FIREBASE_PROJECTID: ${{ secrets.NOTIFIER_FIREBASE_PROJECTID }}
          NOTIFIER_FIREBASE_APPID: ${{ secrets.NOTIFIER_FIREBASE_APPID }}
          NOTIFIER_FIREBASE_APIKEY: ${{ secrets.NOTIFIER_FIREBASE_APIKEY }}
          NOTIFIER_FIREBASE_SENDERID: ${{ secrets.NOTIFIER_FIREBASE_SENDERID }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
