name: Deploy

# Continuous deployment of the Cloudflare Worker: every push to main that
# touches server/ re-runs the checks, applies pending D1 migrations, and
# publishes. Migrations run before the deploy, so the live code briefly sees
# the new schema; keep migrations additive.

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs every dependency's code (tsc, eslint, vitest, miniflare) with no
  # secrets in the job.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # A fresh runner and checkout, so nothing the check job ran can have
  # touched node_modules. Install scripts are skipped and only wrangler runs
  # here, with the Cloudflare credentials passed to its steps alone.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    # Job-level, so a manual check-only run on another branch never joins the
    # group and cannot cancel a pending main deploy.
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Require Cloudflare credentials
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply notifier --remote
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
